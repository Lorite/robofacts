name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-no-ros:
    name: the general package alone, on a plain Python image (no ROS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.10-slim
    steps:
      - uses: actions/checkout@v4
      - name: pip install robofacts only
        run: |
          python -m pip install --upgrade pip
          pip install "./robofacts[test]"
          trials --version && trials --help
          python -c "import importlib.util as u; assert u.find_spec('robofacts_ros2') is None and u.find_spec('rclpy') is None"
      - name: The core's tests, with the test that keeps the core free of ROS
        run: cd robofacts && python -m pytest -q -p no:cacheprovider test
      - name: A generated project runs a campaign from plan to coverage index, without ROS
        run: |
          cd "$(mktemp -d)" && trials init myproject --experiment my_experiment && cd myproject
          trials lint
          trials plan experiments/my_experiment/campaigns/baseline.yaml
          trials run experiments/my_experiment/campaigns/baseline.yaml --limit 1
          trials validate experiments/my_experiment
          trials run experiments/my_experiment/campaigns/baseline.yaml --execute --no-pause
          trials plan experiments/my_experiment/campaigns/baseline.yaml
          trials index --experiment my_experiment --summary
          trials new my_variant --from my_experiment && trials validate experiments/my_variant

  colcon-humble:
    name: colcon build of both packages, tests and the example campaign on ROS 2 Humble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:humble
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/robofacts
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ros-humble-demo-nodes-cpp ros-humble-rosbag2 \
            ros-humble-rosbag2-py ros-humble-rosbag2-storage-mcap ros-humble-rmw-cyclonedds-cpp \
            python3-pip python3-yaml python3-numpy python3-flask python3-pytest python3-colcon-common-extensions git
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ws && colcon build --packages-select robofacts robofacts_ros2
      - name: Test suites of both packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash && source ws/install/setup.bash
          cd ws/src/robofacts && python3 -m pytest -q -p no:cacheprovider robofacts_ros2/test robofacts/test
      - name: The example campaign, end to end
        shell: bash
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source /opt/ros/humble/setup.bash && source ws/install/setup.bash
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<CycloneDDS xmlns="https://cdds.io/config"><Domain id="any"><General><AllowMulticast>default</AllowMulticast></General></Domain></CycloneDDS>' > /tmp/cyclonedds.xml
          export CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
          cd ws/src/robofacts
          ros2 run robofacts_ros2 trials --version
          trials --version
          ./quickstart.sh
      - name: A generated ROS 2 experiment passes lint, plan and a dry run, and so does a copy of it
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash && source ws/install/setup.bash
          cd "$(mktemp -d)" && trials init myproject --backend ros2 --experiment my_experiment && cd myproject
          trials lint
          trials plan experiments/my_experiment/campaigns/baseline.yaml
          trials run experiments/my_experiment/campaigns/baseline.yaml --limit 1
          trials run experiments/my_experiment/campaigns/baseline.yaml --limit 1 --execute --no-pause
          trials index --experiment my_experiment --summary
          trials new my_variant --from my_experiment && trials validate experiments/my_variant

  docker-image:
    name: the quickstart image builds and runs the example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t trials-quickstart -f docker/Dockerfile .
      - name: Run the quickstart
        run: docker run --rm trials-quickstart
