# The project's record profiles: named lists of what a trial records (topics, log files,
# whatever the backend's recorder takes as a source).
#
# A trial picks a profile with a factor whose maps_to has `kind: record_profile`
# (common/config/factors.yaml), or the project names one in trials.yaml as
# `default_record_profile`. An experiment whose sources are its own lists them in its
# runner.yaml as `record_sources` instead (the `custom` level).
#
# Every profile here must also be a level of `record_profile` in trial_metadata_core.yaml,
# or every trial recorded on it fails the metadata contract (lint rule L9).
#
# A source may hold {name} placeholders, filled from `record_profiles:` in trials.yaml
# (the project's own names, such as a robot or a log directory, plus the defaults of an
# enabled adapter). A profile lists blocks, and its list keeps their order and drops
# repeats. Check a profile with `trials profiles <name> --topics-only`.
#
# Example:
#
# blocks:
#   robot_state:
#     - "{log_dir}/state.log"
#     - "{log_dir}/battery.log"
#   camera_debug:
#     - "{log_dir}/camera.log"
# profiles:
#   drive:
#     blocks: [robot_state]
#     size: "~1 MB/min"
#   drive_with_camera:
#     blocks: [robot_state, camera_debug]
#     topics: ["{log_dir}/operator.log"]

blocks: {}
profiles: {}
