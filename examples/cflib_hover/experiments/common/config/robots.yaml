# Robot stop actions: one place that knows how to stop each robot.
#
# Read by the packaged `estop.sh` and `robot_action.sh` (and by a web interface, where the
# backend ships one), so every stop surface uses the same commands, and adding a robot is
# a config edit, not a code change.
#
# A software stop travels laptop -> ssh -> container -> the robot's own link, and every
# hop can fail. The physical e-stop stays the primary kill, and a gate check that reaches
# the stop command must pass FROM THE CONTEXT THAT WILL CALL IT before a trial. Every stop
# command should FIRST write the stop latch file (the gate's `stop_latch` check refuses the
# next trial while a fresh latch exists), so a running trial aborts even if a later hop of
# the stop fails.
#
# Schema per robot:
#   host       : ssh target that can reach the robot ('local' = this machine)
#   container  : docker container to exec into (omit to run directly on the host)
#   shell      : login shell used inside the container
#   soft_stop  : halt gracefully. Preferred when there is time.
#   estop      : cut it now.
#   reset      : steps the runner runs before every trial of an experiment that declares
#                the robot in its runner.yaml `robots:`
#   actions    : named, non-emergency commands a surface may offer (stand, sit, ...)

version: 1

robots:
  # The Crazyflie of the cflib example. The hover action holds the only radio link, so a stop
  # cannot send its own command to the drone: it writes the latch, and the action, which reads
  # the latch every 20 ms, lands (soft_stop) or cuts the motors (a last line starting with estop).
  crazyflie:
    host: local
    verified: false        # set to true after the first flight that tested both stops
    soft_stop:
      description: "The hover action lands the drone"
      command: echo "soft_stop crazyflie $(date -Iseconds)" >> /tmp/trial_stop_latch
    estop:
      description: "The hover action cuts the motors - the drone WILL fall"
      command: echo "estop crazyflie $(date -Iseconds)" >> /tmp/trial_stop_latch
    # Before every trial: a power cycle over the radio clears log blocks that a crashed earlier
    # session left streaming (they hang the next connection) and restarts the estimator.
    reset:
      - name: cf_power_cycle
        command: python3 experiments/cflib_hover/scripts/cf_link.py power-cycle
        when: always
