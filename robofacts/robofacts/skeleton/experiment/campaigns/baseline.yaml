# A campaign of the experiment {{name}}: which factors to sweep, which to fix, how many
# repetitions. `trials plan` lists the cells that still miss trials.
name: baseline
experiment: {{name}}
describe: >-
  Sweep the rate factor with two repetitions per level. Write here what the resulting
  trials will evidence and what is safety-critical about collecting them: the operator
  reads this before the first trial.
repetitions: 2
sweep:
  rate: [slow, fast]
