# The named analyses of the experiment {{name}}: repeatable computations over a cohort of
# usable trials. `trials analyze {{name}} <name>` prints the commands, `--execute` runs them
# and writes analysis_metadata.json with the exact list of recordings.
analyses:
  line_count:
    describe: "How many lines each recording holds, as a JSON file per recording."
    per: bag
    command: >-
      python3 experiments/{{name}}/scripts/verify_log.py {recording}
      --min-lines 0 --json {results}/line_count.json
