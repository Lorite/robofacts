# The factors of the experiment {{name}}: the axes a campaign may vary.
#
# Each factor has levels, a default (the level of a campaign that does not name it), the
# metadata key every trial records it under, and how the runner realizes a level
# (maps_to.kind): internal (a {placeholder} in a command), launch_arg (an argument of the
# stack), host (the computer), record_profile (what is recorded), operator (a person, with a
# check or an explicit `unchecked:` reason).
version: 1

factors:
  rate:
    describe: >-
      How fast the system writes to its log, as a stand-in for a real independent variable.
      Different levels produce different recordings, so the coverage grid fills in as
      trials run.
    levels: [slow, fast]
    default: slow
    metadata_key: rate
    maps_to: {kind: internal}
