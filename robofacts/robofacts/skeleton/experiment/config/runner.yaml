# How to run one trial of the experiment {{name}}.
#
# The runner owns the order (setup steps -> start the stack -> settle -> gate -> record ->
# action -> stop the recorder first -> stop the stack -> verify steps -> metadata). This
# file only says what is specific to this experiment.

# true only when every robot of the experiment is simulated or there is none.
# Every trial records its domain (simulation | hardware) from this flag, and a
# `gate` factor (shadow or disabled gate) is allowed only in simulation.
simulation: true

# The stack: one command that runs until the runner stops it. {factor} placeholders are
# filled with the trial's levels. Remove the block for an experiment without a stack.
launch:
  command: "python3 experiments/{{name}}/scripts/system.py --rate {rate} --log experiments/{{name}}/runs/system.log"

# Foreground commands run before the stack is started, in order. A required step that
# fails aborts the trial.
# setup_steps:
#   - {name: power_on, command: "python3 experiments/{{name}}/scripts/power_on.py"}

# Long-running helpers started with the stack and stopped before it.
# aux_launches:
#   - {name: monitor, command: "python3 experiments/{{name}}/scripts/monitor.py --out {recording}"}

# What to record: the files whose new lines the recorder stores during the trial.
record_sources: [experiments/{{name}}/runs/system.log]

# The one foreground command that IS the trial. It runs in the project root.
action:
  command: "python3 experiments/{{name}}/scripts/run_trial.py --rate {rate}"

# Seconds between the start of the stack and the recorder, and the grace period at stop.
settle_s: 1
stop_grace_s: 1

# Optional deadline on the action, in seconds: a still-running action receives
# SIGTERM and the trial is aborted with the timeout as its reason.
# action_timeout_s: 120

# Checks against the RECORDING, once the recorder has stopped ({recording} is its
# directory). A non-zero exit marks the trial failed: an action can exit 0 without the
# trial having happened, and only the recording describes the experiment.
# Every experiment declares at least one (lint L6). An experiment where no check of the
# recording is possible says so instead: `no_verify_steps: "<the reason>"`.
verify_steps:
  - name: log_was_recorded
    command: "python3 experiments/{{name}}/scripts/verify_log.py {recording} --rate {rate} --min-lines 3"

# Provenance probed on the host that ran the trial, after it, into the metadata
# under `key` (the first line of stdout). Never fatal, never a factor.
# metadata_probes:
#   - {key: firmware_version, command: "cat firmware/version.txt"}

# One entry per level of the execution_host factor that this experiment may run
# on. `local: true` runs here; a remote host gets `ssh <host> docker exec
# <container> <shell> -c ...` and brings the recording back.
hosts:
  laptop:
    local: true
  # rig:
  #   host: my-robot-host            # an ssh alias
  #   container: my_container        # omit to run directly on the host
  #   workspace: /workspaces/my_project
  #   env_setup: [/home/me/env.sh]   # files to source before each command
  # The T-0 gate of a trial runs on its host as well, with the checklist sent along.
